<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ethereal Emblems</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* PASTE CSS HERE */
* { margin:0; padding:0; box-sizing:border-box; }

body {
background-color:#f4f2f7;
font-family:'Poppins', sans-serif;
color:#2e294e;
}

.navbar {
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 70px;
background:#fff;
}

.logo-box {
width:75px;
height:75px;
background:#d9c8ee;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
border-radius:6px;
color:white;
}

.nav-links { display:flex; gap:40px; }

.nav-links a {
text-decoration:none;
font-size:13px;
letter-spacing:1px;
color:#3c355f;
}

.nav-right { display:flex; gap:18px; align-items:center; }

.user {
width:32px;
height:32px;
background:#f07c57;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.cart { position:relative; }

.cart span {
position:absolute;
top:-7px;
right:-10px;
background:#2d2152;
color:white;
font-size:10px;
padding:2px 6px;
border-radius:50%;
}

.hero {
display:flex;
justify-content:space-between;
align-items:center;
padding:100px 90px;
}

.hero-left { max-width:520px; }

.hero-left h1 {
font-family:'Playfair Display', serif;
font-size:76px;
color:#2d2152;
margin-bottom:25px;
}

.hero-left p {
font-size:14px;
line-height:1.85;
color:#5f5a73;
margin-bottom:35px;
}

.hero-left button {
background:linear-gradient(90deg,#7c4dff,#a86cf7);
padding:14px 32px;
border:none;
border-radius:30px;
color:white;
cursor:pointer;
}

.hero-right h2 {
font-family:'Playfair Display', serif;
font-size:70px;
color:#2c2c2c;
text-align:center;
}
</style>

</head>

<body>

<header class="navbar">
<div class="logo-box">
✿
<div style="font-size:9px;">Ethereal Emblems</div>
</div>

<nav class="nav-links">
<a href="#">HOME</a>
<a href="#">SHOP</a>
<a href="#">LOGIN</a>
</nav>

<div class="nav-right">
<div class="user">V</div>
<div class="cart">🛍<span>0</span></div>
</div>
</header>

<section class="hero">
<div class="hero-left">
<h1>Ethereal<br>Emblems</h1>

<p>
Each piece is thoughtfully handcrafted using genuine, natural stones,
shells and sea glass making every design as unique as the person who wears it...
</p>

<button>Shop the Collection</button>
</div>

<div class="hero-right">
<h2>Coming<br>Soon</h2>
</div>
</section>

</body>
</html>
